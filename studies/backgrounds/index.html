<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cairn Background Workshop</title><style>
*{box-sizing:border-box}body{margin:0;background:#111210;color:#ded6c5;font:15px system-ui}main{max-width:1500px;margin:auto;padding:20px}h1{font:28px Georgia;margin:0 0 5px}button,select,textarea{background:#252721;color:inherit;border:1px solid #625840;padding:9px;border-radius:3px}button{cursor:pointer}button:hover{background:#454332}header,p{color:#b6ae9d}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}canvas{width:100%;aspect-ratio:16/9;display:block;background:black}textarea{width:100%;min-height:75px}.stage{position:relative}#stamp{font-variant-numeric:tabular-nums}label{margin-right:12px}small{color:#b8aa89}
</style></head><body><main><header>CAIRN / BACKGROUND WORKSHOP</header><h1 id="title"></h1><small id="status"></small><div class="toolbar"><select id="version"><option value="citadel-02-v1">World 1 / Screen 2 � breached gate (draft)</option><option value="citadel-01-v5">World 1 / Screen 1 � aqueduct (approved)</option><option value="citadel-01-v4">V4 - waterfall and fire</option><option value="citadel-01-v3">V3 - waterfall comparison</option><option value="citadel-01-v1">V1 - reference draft</option></select><label><input id="seam" type="checkbox">Seam check</label><button id="play">Pause [Space]</button><button id="restart">Restart</button><button id="step">Next frame [→]</button><select id="speed"><option value=".5">Half speed</option><option value="1" selected>Normal speed</option><option value="2">Double speed</option></select><label title="Blend two offset flow phases to hide the texture reset. Off exposes the raw single-phase loop."><input id="blend" type="checkbox" checked>Frame / flow blending</label><label><input id="bounds" type="checkbox">Region boundaries</label><label><input id="lane" type="checkbox">Walkable area</label><label><input id="still" type="checkbox">Still reference</label><button id="full">Fullscreen</button><span id="stamp"></span></div><div id="regions" class="toolbar"></div><div class="stage"><canvas width="1280" height="720"></canvas></div><p id="notes"></p><textarea id="feedback" placeholder="What works? What should change? Mention region and frame if useful."></textarea><div class="toolbar"><button data-decision="changes-requested">Request changes</button><button data-decision="painting-approved">Approve composition</button><button data-decision="animation-approved">Approve animation</button><button id="export">Export review</button><span id="saved"></span></div><small>Review decisions are saved in this browser and can be exported. Approval does not automatically alter the game.</small></main><script type="module">
import {installComposition} from './composition.js';
import {createBakedLoops} from './baked-loops.js';
import {installEditor} from './editor.js';
import {createWaterfall} from './waterfall.js';
const requested=new URLSearchParams(location.search).get('version');const version=['citadel-01-v1','citadel-01-v3','citadel-01-v4','citadel-01-v5','citadel-02-v1'].includes(requested)?requested:'citadel-02-v1';const base='./'+version+'/',m=await(await fetch(base+'screen.json')).json();const $=s=>document.querySelector(s),c=$('canvas'),g=c.getContext('2d');const images=await Promise.all(m.frames.map(src=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=base+src})));const flow=m.regions.every(r=>r.animation)?await createBakedLoops(images[0],m.regions,c.width,c.height,base):version!=='citadel-01-v1'?await createWaterfall(images[0],m.regions,c.width,c.height):null;const editor=installEditor(c,m,flow);const composition=installComposition(c,m,images[0],editor);const frameCount=flow?60:images.length;window.loopCheck=flow?flow.checkLoop():null;$('#title').textContent=m.title;$('#status').textContent=m.id+' · '+m.status;$('#notes').textContent=m.notes+(flow?' Loop endpoint check: '+window.loopCheck+' / 255 maximum pixel difference.':'');let running=true,time=0,last=performance.now(),manual=null,decision='unreviewed';let review=JSON.parse(localStorage.getItem(m.id)||'{}');$('#feedback').value=review.notes||'';decision=review.decision||decision;$('#version').value=version;$('#version').onchange=e=>location.search='?version='+e.target.value;function frameAt(r){if(manual!==null)return manual;const tick=Math.floor(time*r.fps);return $('#seam').checked?[frameCount-2,frameCount-1,0,1][tick%4]:tick%frameCount}const enabled=m.regions.map(()=>true);m.regions.forEach((r,i)=>{let l=document.createElement('label');l.innerHTML=`<input type="checkbox" checked> ${r.name} (${r.fps} fps)`;l.firstChild.onchange=e=>enabled[i]=e.target.checked;$('#regions').append(l)});
function path(r){g.beginPath();r.polygon.forEach(([x,y],i)=>i?g.lineTo(x*c.width,y*c.height):g.moveTo(x*c.width,y*c.height));g.closePath()}
function draw(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(running)time+=dt*Number($('#speed').value);g.drawImage(images[0],0,0,c.width,c.height);if(flow){const ft=manual!==null?manual/30:$('#seam').checked?((1.85+time%0.3)%2):time;g.drawImage(flow.render(ft,enabled[0]&&!$('#still').checked,$('#bounds').checked,enabled[1]&&!$('#still').checked,$('#blend').checked),0,0)}m.regions.forEach((r,i)=>{let f=frameAt(r);if(!flow&&enabled[i]&&!$('#still').checked){g.save();path(r);g.clip();g.drawImage(images[f],0,0,c.width,c.height);g.restore()}if($('#bounds').checked){path(r);g.strokeStyle='#ead9a0';g.lineWidth=2;g.stroke()}});if($('#lane').checked){const lane=m.walkable||{polygon:[[.025,.699],[.975,.699],[.975,.842],[.025,.842]]};path(lane);g.fillStyle='#74cd8130';g.fill();g.strokeStyle='#9bce99';g.lineWidth=2;g.setLineDash([8,6]);g.stroke();g.setLineDash([]);g.fillStyle='#e2f2df';g.font='14px system-ui';g.fillText('Walkable foot positions - clear of rubble and front edge',c.width*.04,c.height*.729)}composition.draw(g);editor.draw(g);$('#stamp').textContent=`${time.toFixed(2)}s · frames ${m.regions.map(r=>frameAt(r)+1).join(' / ')}`;requestAnimationFrame(draw)}requestAnimationFrame(draw);
function pause(){running=!running;manual=null;$('#play').textContent=running?'Pause [Space]':'Play [Space]'}$('#play').onclick=pause;$('#restart').onclick=()=>{time=0;manual=null};function step(){running=false;manual=((manual??Math.floor(time*m.regions[0].fps))+1)%frameCount;$('#play').textContent='Play [Space]'}$('#step').onclick=step;onkeydown=e=>{if(editor.active()||['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();pause()}if(e.code==='ArrowRight')step()};$('#full').onclick=()=>c.requestFullscreen();function save(){review={screen:m.id,decision,flowBlending:$('#blend').checked,notes:$('#feedback').value,reviewedAt:new Date().toISOString()};localStorage.setItem(m.id,JSON.stringify(review));$('#saved').textContent=decision+' · saved'}document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{decision=b.dataset.decision;save()});$('#feedback').onchange=save;$('#export').onclick=()=>{save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(review,null,2)],{type:'application/json'}));a.download=m.id+'-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
