<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cairn — controls design preview</title><style>html,body{margin:0;background:#050606;color:#c9bea2;font:16px Georgia}body{min-height:100vh;display:grid;place-items:center}main{position:relative;width:min(100vw,177.777vh);aspect-ratio:16/9}img{display:block;width:100%}button{position:absolute;background:transparent;border:0;cursor:pointer;color:transparent}button:focus-visible{outline:1px solid #a89775}#combat{left:39%;top:14.5%;width:10%;height:6%}#menus{left:51%;top:14.5%;width:10%;height:6%}#back{left:44%;top:86%;width:12%;height:8%}</style><main><img id="screen" src="controls-combat-v1.png" alt="Cairn controls table design preview"><button id="combat" aria-label="Combat controls">Combat</button><button id="menus" aria-label="Menu controls">Menus</button><button id="back" aria-label="Back to combat preview">Back</button></main><script>let page='combat';function show(next){page=next;document.querySelector('#screen').src=`controls-${page}-v1.png`}combat.onclick=()=>show('combat');menus.onclick=()=>show('menus');back.onclick=()=>show('combat');window.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();show(page==='combat'?'menus':'combat')}if(e.key==='Escape')show('combat')}</script></html>
