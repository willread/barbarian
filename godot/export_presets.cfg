[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/manifest.json,assets/*-OFL.txt,art/*.json,audio_options/*.json,voice/*.json"
exclude_filter="native/*,tests/*,audio/*.mp3,audio/foot_*,audio/bow_draw*,audio/arrow_ground*,audio_options/foot_*,audio_options/bow_draw-*,audio_options/arrow_ground-*"
export_path="build/web/index.html"

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="native/*.cfg,assets/manifest.json,assets/*-OFL.txt,art/*.json,audio_options/*.json,voice/*.json"
exclude_filter="tests/*,audio/*.mp3,audio/foot_*,audio/bow_draw*,audio/arrow_ground*,audio_options/foot_*,audio_options/bow_draw-*,audio_options/arrow_ground-*"
export_path="build/windows/Cairn.exe"

[preset.1.options]
custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/icon="res://art/branding/cairn.ico"
application/product_name="Cairn"
application/file_description="Cairn"

